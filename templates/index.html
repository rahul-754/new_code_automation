<!DOCTYPE html>
<html>
<head>
    <title>Mini-Portia: Live Selector Tool</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; }
        #preview { width: 100%; height: 500px; border: 1px solid #ccc; }
        .field-entry { margin: 8px 0; background: #f9f9f9; padding: 6px 8px; border-radius: 5px; }
        code { background: #eee; font-family: monospace; padding: 2px 6px; border-radius: 4px; }
        .remove-btn { color: red; cursor: pointer; font-weight: bold; margin-left: 8px; }
    </style>
    <script src="/static/main.js" defer></script>
</head>
<body>
    <h1>Mini-Portia: Live Selector Tool</h1>
    <input type="text" id="urlInput" placeholder="Enter URL" size="60">
    <button id="loadBtn">Load</button>
    <br><br>
    <iframe id="preview"></iframe>

    <h3>Selected Fields</h3>
    <div id="fieldsContainer"></div>
    <button id="generateBtn">Generate Python Code</button>

    <h3>Generated Code</h3>
    <pre id="generatedCode" style="background:#fafafa;padding:1em"></pre>
</body>
</html>
